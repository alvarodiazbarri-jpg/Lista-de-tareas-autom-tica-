# Publica la app en GitHub Pages cada vez que hay cambios en la rama main.
name: Publicar app

on:
  push:
    branches: [main]
  workflow_dispatch: # permite publicarla a mano desde la pestaña "Actions"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Preparar archivos de la app
        run: |
          mkdir _site
          cp -r index.html agenda.html styles.css sw.js manifest.webmanifest js icons _site/
          # Comprobar que están las páginas principales
          test -f _site/index.html && test -f _site/agenda.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
